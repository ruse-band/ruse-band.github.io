<!DOCTYPE html>
<html>
<head>

    <title>RUSE - Photos</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nabla&family=Special+Elite&display=swap" rel="stylesheet">
    <script src="assets/js/script.js"></script>
    
    
</head>

<body>

   <script src="photoswipe/dist/umd/photoswipe.umd.min.js"></script>
    <script src="photoswipe/dist/umd/photoswipe-lightbox.umd.min.js"></script>
    
    <link rel="stylesheet" href="photoswipe/dist/photoswipe.css">

    <div class="test-gallery">
      <a href="images/lightbox/Originals/A7409376.jpg" data-pswp-width="3072" data-pswp-height="4608">
        <img src="images/lightbox/A7409376 (Medium) (Phone).jpg" alt="Malcolm @ Bar De Courcelle - Robot Dreams Release Party" />
        
      </a>
      <a href="images/lightbox/Originals/A7409386.jpg" data-pswp-width="3072" data-pswp-height="4608">
        <img src="images/lightbox/A7409386 (Medium) (Phone).jpg" alt="Lena @ Bar De Courcelle" />
      </a>
      <a href="images/lightbox/Originals/IMG_7455.JPG" data-pswp-width="2848" data-pswp-height="4272">
        <img src="images/lightbox/IMG_7455 (Medium) (Phone).JPG" alt="Paul Recording @ Sud-Ouest Studio" />
      </a>
      <a href="images/lightbox/Originals/untitled (13 of 60).jpg" data-pswp-width="2848" data-pswp-height="4272">
        <img src="images/lightbox/untitled (13 of 60) (Medium) (Phone).jpg" alt="@ The Diving Bell" />
      </a>
      <a href="images/lightbox/Originals/IMG_7462.JPG" data-pswp-width="4272" data-pswp-height="2848">
        <img src="images/lightbox/IMG_7462 (Phone).JPG" alt="Paul @ Sud-Ouest" />
      </a>
      <a href="images/lightbox/Originals/A7409451.jpg" data-pswp-width="3072" data-pswp-height="4608">
        <img src="images/lightbox/A7409451 (Medium) (Phone).jpg" alt="Quentin @ Bar De Courcelle - Robot Dreams Release Party" />
      </a>



    </div>
    
    <script type="text/javascript">
      var lightbox = new PhotoSwipeLightbox({
        gallery: '.test-gallery',
        children: 'a',
        // dynamic import is not supported in UMD version
        pswpModule: PhotoSwipe 
      });

     
  lightbox.on('uiRegister', function() {
  lightbox.pswp.ui.registerElement({
    name: 'custom-caption',
    className: 'pswp__custom-caption',
    order: 9,
    isButton: false,
    appendTo: 'root',
    html: 'Caption text',
    onInit: (el, pswp) => {
      lightbox.pswp.on('change', () => {
        const currSlide = pswp.currSlide;
        // Grab caption from data-caption or the alt tag
        let captionText = currSlide.data.element.getAttribute('data-caption');
        
        if (!captionText) {
          captionText = currSlide.data.element.querySelector('img').getAttribute('alt');
        }

        el.innerHTML = captionText || '';
      });
    }
  });
});
      lightbox.init();
    </script>

    

</body>
</html>
