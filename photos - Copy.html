<!DOCTYPE html>
<html>
<head>

    <title>RUSE - Photos</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nabla&family=Special+Elite&display=swap" rel="stylesheet">
    <script src="assets/js/script.js"></script>
    
</head>

<body>

   <!-- SLIDESHOW -->

<div class="slideshow-container">

  <!-- Full-width images with number and caption text -->

  <div class="mySlides">
    
    <img src="images/slideshow/A7409462.jpg" style="width:100%">
    
  </div>

  <div class="mySlides">
   
    <img src="images/slideshow/untitled (51 of 60).jpg" style="width:100%">
    
  </div>

  <div class="mySlides">
   
    <img src="images/slideshow/A7409389.jpg" style="width:100%">
    
  </div>

  <div class="mySlides">
   
    <img src="images/slideshow/IMG_7461.JPG" style="width:100%">
    
  </div>

  <div class="mySlides">
   
    <img src="images/slideshow/A7409525.jpg" style="width:100%">
    
  </div>

 <!-- Next and previous buttons -->
  <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
  <a class="next" onclick="plusSlides(1)">&#10095;</a>
</div>
<br>

<!-- The dots/circles -->
<div style="text-align:center">
  <span class="dot" onclick="currentSlide(1)"></span>
  <span class="dot" onclick="currentSlide(2)"></span>
  <span class="dot" onclick="currentSlide(3)"></span>
  <span class="dot" onclick="currentSlide(4)"></span>
  <span class="dot" onclick="currentSlide(5)"></span>
</div>



<!-- Second Try -->

<!-- Gallery Grid -->
<div class="gallery">
  
  <img src="images\lightbox\untitled (6 of 60).jpg" alt="Description" onclick="openModal('images\lightbox\untitled (6 of 60).jpg')">
  <img src="img2.jpg" alt="Description" onclick="openModal('img2.jpg')">

  
</div>

<!-- Popup Modal -->
<div id="myModal" class="modal" onclick="this.style.display='none'">
  <span class="close">&times;</span>
  <img class="modal-content" id="img01">
</div>





<!-- JAVASCRPT -->


<script>

function openModal(imgSrc) {
  document.getElementById("img01").src = imgSrc;
  document.getElementById("myModal").style.display = "block";
}





let slideIndex = 1;
showSlides(slideIndex);

// Next/previous controls
function plusSlides(n) {
  showSlides(slideIndex += n);
}

// Thumbnail image controls
function currentSlide(n) {
  showSlides(slideIndex = n);
}

function showSlides(n) {
  let i;
  let slides = document.getElementsByClassName("mySlides");
  let dots = document.getElementsByClassName("dot");
  if (n > slides.length) {slideIndex = 1}
  if (n < 1) {slideIndex = slides.length}
  for (i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";
  }
  for (i = 0; i < dots.length; i++) {
    dots[i].className = dots[i].className.replace(" active", "");
  }
  slides[slideIndex-1].style.display = "block";
  dots[slideIndex-1].className += " active";
}

    
</script>



</body>
</html>
