<script>


window.addEventListener("load", function() {
    var loader = document.getElementById("loader");
    loader.style.display = "none";
});



window.onload = function() {
    setTimeout(function() {
        document.getElementById('img1').style.display = 'block';
    }, 4000); // 3000 milliseconds = 3 seconds
};


window.addEventListener('load', (event) => {
  const element = document.getElementById('main-page');
  element.style.display = 'block'; // Or 'flex', 'grid', etc.
});



// List your video file paths in order
    const playlist = ["video/HeaderVideo-1.mov", "video/HeaderVideo-2.mov", "video/HeaderVideo-3.mov"];
    let currentTrack = 0;

    const playerA = document.getElementById('playerA');
    const playerB = document.getElementById('playerB');

    // Initialize the first track on Player A and pre-prime Player B
    playerA.src = playlist[0];
    playerB.src = playlist[1];

    function setupTransitions(currentPlayer, nextPlayer) {
        currentPlayer.addEventListener('ended', function onEnded() {
            // Remove listener so it doesn't double-trigger later
            currentPlayer.removeEventListener('ended', onEnded);

            // 1. Instantly swap visual visibility
            currentPlayer.classList.replace('visible', 'hidden');
            nextPlayer.classList.replace('hidden', 'visible');

            // 2. Play the preloaded next video instantly
            nextPlayer.play();

            // 3. Move index forward for the next cycle
            currentTrack = (currentTrack + 1) % playlist.length;
            const upcomingTrack = (currentTrack + 1) % playlist.length;

            // 4. Repurpose the old player to buffer the upcoming video
            currentPlayer.src = playlist[upcomingTrack];
            currentPlayer.load();

            // 5. Alternate roles for the next 'ended' event
            setupTransitions(nextPlayer, currentPlayer);
        });
    }

    // Start the cycle
    setupTransitions(playerA, playerB);

</script>
